name: Sloppertizer · native SEAL source capture
on:
  push:
    branches: [sloppertizer-visual-v2-benchmark-20261015]
    paths: ['.github/workflows/seal-native-capture.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node scripts/seal-native-design-capture.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seal-native-html-css
          path: research/seal-native-source
          retention-days: 3
          if-no-files-found: warn
