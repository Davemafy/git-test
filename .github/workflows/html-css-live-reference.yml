name: Sloppertizer · real website HTML CSS fidelity
on:
  push:
    branches: [sloppertizer-visual-v2-benchmark-20261015]
    paths:
      - 'scripts/source-html-css-live-reference.mjs'
      - '.github/workflows/html-css-live-reference.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture-and-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node scripts/source-html-css-live-reference.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: html-css-live-visual-comparisons
          path: research/html-css-live-evidence/
          retention-days: 2
          if-no-files-found: warn
