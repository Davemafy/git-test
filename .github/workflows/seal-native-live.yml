name: Sloppertizer · source native visual benchmark
on:
  push:
    branches: [sloppertizer-visual-v2-benchmark-20261015]
    paths: ['.github/workflows/seal-native-live.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 36
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Generate SEAL native-source redesign
        env:
          SMOKE_EXPECTED_REVISION: f1c99d94447d34a1fdb04eae96ce769ccd5a9730
          BENCHMARK_OUT: native-output
        run: node scripts/seal-native-live-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-native-seal-engine-result
          path: native-output/
          retention-days: 3
          if-no-files-found: warn
