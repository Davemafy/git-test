name: Sloppertizer · quality output visual smoke
on:
  push:
    branches: [sloppertizer-visual-v2-benchmark-20261015]
    paths: ['.github/workflows/seal-quality-output.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Create and render actual quality candidate
        env:
          SMOKE_EXPECTED_REVISION: ba5c43b4b7d85eaa5b4b3ddf0a7b59bd5b0d6fa5
          BENCHMARK_OUT: seal-quality-output
        run: node scripts/seal-quality-live-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seal-quality-real-engine-render
          path: seal-quality-output/
          retention-days: 3
          if-no-files-found: warn
