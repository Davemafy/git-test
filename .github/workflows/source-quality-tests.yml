name: Sloppertizer · source visual quality checks
on:
  push:
    branches: [sloppertizer-visual-v2-benchmark-20261015]
    paths: ['.github/workflows/source-quality-tests.yml','src/redesign-content.mjs','src/redesign-source-appendix.test.mjs']
  workflow_dispatch:
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node --test src/redesign-source-appendix.test.mjs
